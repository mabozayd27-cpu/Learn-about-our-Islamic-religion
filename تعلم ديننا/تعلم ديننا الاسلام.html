let currentPage=1;
const perPage=20;

function showPage(page){
 currentPage=Math.max(1,Math.min(2,page));
 const list=document.getElementById("lessonList"); list.innerHTML="";
 const start=(currentPage-1)*perPage;
 lessons.slice(start,start+perPage).forEach((lesson,i)=>{
   const index=start+i, div=document.createElement("div");
   div.className="lesson";
   div.innerHTML=`<span class="num">${index+1}</span><h3>${lesson.title}</h3>`;
   div.onclick=()=>openLesson(index);
   list.appendChild(div);
 });
 document.getElementById("p1").classList.toggle("active",currentPage===1);
 document.getElementById("p2").classList.toggle("active",currentPage===2);
 window.scrollTo({top:0,behavior:"smooth"});
}
function changePage(n){showPage(currentPage+n)}
function openLesson(index){
 const l=lessons[index];
 document.getElementById("homePage").style.display="none";
 document.getElementById("lessonPage").style.display="block";
 document.getElementById("lessonTitle").textContent=l.title;
 let x=`<section class="section"><h3>🌿 المقدمة</h3><p>${l.intro}</p></section>`;
 x+=`<section class="section"><h3>📖 آيات من القرآن الكريم</h3>`;
 l.quran.forEach(a=>x+=`<div class="quran">${a}</div>`); x+=`</section>`;
 x+=`<section class="section"><h3>🕌 أحاديث نبوية</h3>`;
 l.hadith.forEach(a=>x+=`<div class="hadith">${a}</div>`); x+=`</section>`;
 x+=`<section class="section"><h3>💡 شرح وتوضيح</h3><p>${l.explanation}</p></section>`;
 x+=`<section class="section"><h3>🌱 فوائد وعبر</h3><div class="benefits"><ul>`;
 l.benefits.forEach(a=>x+=`<li>${a}</li>`); x+=`</ul></div></section>`;
 x+=`<section class="section"><h3>✨ موعظة</h3><div class="advice">${l.advice}</div></section>`;
 x+=`<section class="section"><h3>🤲 دعاء في النهاية</h3><div class="dua">${l.dua}</div></section>`;
 document.getElementById("lessonText").innerHTML=x;
 window.scrollTo({top:0,behavior:"smooth"});
}
function backHome(){
 document.getElementById("lessonPage").style.display="none";
 document.getElementById("homePage").style.display="block";
 showPage(currentPage);
}
showPage(1);
